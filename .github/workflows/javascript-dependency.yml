name: JavaScript dependency and API baselines
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
  workflow_dispatch:
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static dependency inventory
        run: python scripts/audit_js_dependencies.py
      - name: JavaScript baseline tests
        run: node tests/js-api-baseline.test.cjs
      - name: RF model regression tests
        run: node tests/rf-model-regression.test.cjs
      - name: Tiled coverage tests
        run: node --test tests/tiled-coverage.test.cjs
      - name: RF ring-search synthetic tests
        run: node --test tests/ring-search.test.cjs
      - name: On-demand tile scheduler tests
        run: node --test tests/on-demand-tiles.test.cjs
      - name: On-demand RF adapter tests
        run: node --test tests/on-demand-rf-adapter.test.cjs
      - name: On-demand live wiring tests
        run: node --test tests/on-demand-live-wiring.test.cjs
      - name: Ring RF adapter tests
        run: node --test tests/ring-rf-adapter.test.cjs
      - name: Ring auto-range wiring tests
        run: node --test tests/ring-auto-range-wiring.test.cjs
      - name: Search and raster extent planning tests
        run: node --test tests/search-raster-extent.test.cjs
      - name: Ring extent UI wiring tests
        run: node --test tests/ring-extent-ui.test.cjs
      - name: HTML inline script syntax
        run: node --test tests/html-inline-syntax.test.cjs
