name: RF browser integration smoke tests
on:
  push:
    branches:
      - 'test/browser-*'
  pull_request:
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/rf-static-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/rf-static-server.log
          exit 1
      - name: Browser integration tests
        run: node --test tests/browser-integration.test.cjs
        env:
          RF_TEST_BASE_URL: http://127.0.0.1:8765
