name: JavaScript dependency and API baselines
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
  workflow_dispatch:
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static dependency inventory
        run: python scripts/audit_js_dependencies.py
      - name: JavaScript baseline tests
        run: node tests/js-api-baseline.test.cjs
      - name: RF model regression tests
        run: node tests/rf-model-regression.test.cjs
