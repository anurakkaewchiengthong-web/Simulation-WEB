<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITU Grid Lookup — Test</title><style>body{font:16px system-ui;background:#0b1c2b;color:#eaf5fa;max-width:760px;margin:32px auto;padding:0 18px}fieldset{border:1px solid #456;padding:18px;border-radius:12px}label{display:block;margin:12px 0}input{padding:8px;background:#162d40;color:white;border:1px solid #567;border-radius:6px}input[type=number]{width:125px}button{padding:10px 18px;background:#40d5c7;border:0;border-radius:7px}pre{white-space:pre-wrap;background:#152d3d;padding:16px;border-radius:8px}</style><h1>ITU geographic grid lookup</h1><p>ทดสอบ CSV จากแหล่งข้อมูล ITU ในเครื่องของคุณ (ไม่อัปโหลดไฟล์ไปเซิร์ฟเวอร์) ต้องมีคอลัมน์ latitude,longitude,value หรือ latitude,longitude,dN75 เป็นต้น</p><fieldset><legend>ตำแหน่งสถานี</legend><label>A Latitude <input id="aLat" type="number" step="any" value="18.106857"> Longitude <input id="aLon" type="number" step="any" value="102.227164"></label><label>B Latitude <input id="bLat" type="number" step="any" value="18.116615"> Longitude <input id="bLon" type="number" step="any" value="102.222684"></label><label>เลือก CSV <input type="file" id="file" accept=".csv,text/csv"></label><button id="calc">Calculate midpoint and lookup</button></fieldset><pre id="out">กรุณาเลือกไฟล์ CSV ก่อนคำนวณ</pre><script src="./itu-grid.js"></script><script>
document.getElementById("calc").onclick=async()=>{
 const out=document.getElementById("out");
 try{
  const num=id=>{const v=Number(document.getElementById(id).value);if(!Number.isFinite(v))throw Error("Invalid coordinate");return v};
  const a=[num("aLat"),num("aLon")],b=[num("bLat"),num("bLon")];
  if([...a,...b].some((v,i)=>i%2===0?Math.abs(v)>90:Math.abs(v)>180))throw Error("Coordinates outside valid range");
  const mid=ITUGrid.midpoint(...a,...b);
  const file=document.getElementById("file").files[0];
  if(!file)throw Error("Please select an ITU CSV dataset");
  const points=ITUGrid.parseCSV(await file.text());
  const value=ITUGrid.lookup(points,mid.lat,mid.lon);
  out.textContent=JSON.stringify({midpoint:mid,interpolatedValue:value,gridPoints:points.length},null,2);
 }catch(e){out.textContent="Lookup unavailable: "+e.message}
};
</script></html>
